<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Test - Trainee Form</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .success { color: green; padding: 20px; background: #d4edda; border-radius: 8px; margin: 20px 0; }
        .error { color: red; padding: 20px; background: #f8d7da; border-radius: 8px; margin: 20px 0; }
        .info { background: #d1ecf1; padding: 15px; border-radius: 8px; margin: 20px 0; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 8px; overflow-x: auto; }
        button { padding: 15px 30px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🧪 Quick Test - Trainee Form</h1>
    
    <div class="info">
        <h3>Test Configuration:</h3>
        <ul>
            <li><strong>Access Key:</strong> 33b74c40648c42308bd9f449d629f031</li>
            <li><strong>Endpoint:</strong> https://splitforms.com/api/submit</li>
        </ul>
    </div>
    
    <h3>Test Buttons:</h3>
    <button onclick="testAPI()">Test API Directly</button>
    <button onclick="testFunctions()">Test Functions</button>
    <button onclick="testFullSubmit()">Test Full Submission</button>
    <button onclick="clearLog()">Clear Log</button>
    
    <h3>Console Output:</h3>
    <pre id="log"></pre>
    
    <div id="result"></div>
    
    <script src="https://minjarul1.github.io/trainee-form-portal/splitforms.js"></script>
    <script>
        const logEl = document.getElementById('log');
        const resultEl = document.getElementById('result');
        
        function log(msg) {
            const timestamp = new Date().toLocaleTimeString();
            logEl.textContent += `[${timestamp}] ${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }
        
        function clearLog() {
            logEl.textContent = '';
            resultEl.innerHTML = '';
        }
        
        async function testAPI() {
            log('🧪 Testing splitforms API directly...');
            try {
                const response = await fetch('https://splitforms.com/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        access_key: '33b74c40648c42308bd9f449d629f031',
                        form_loaded_at: Date.now(),
                        botcheck: false,
                        subject: 'Quick Test',
                        'Full Name (English)': 'Test User',
                        'Email': 'test@test.com'
                    })
                });
                
                const result = await response.json();
                log('📥 Status: ' + response.status);
                log('📥 Result: ' + JSON.stringify(result));
                
                if (result.success) {
                    showSuccess('✅ API Test PASSED! splitforms is working.');
                } else {
                    showError('❌ API Test FAILED: ' + result.message);
                }
            } catch (error) {
                showError('❌ API Error: ' + error.message);
            }
        }
        
        function testFunctions() {
            log('🧪 Testing functions...');
            log('submitForm type: ' + typeof submitForm);
            log('submitToSplitForms type: ' + typeof submitToSplitForms);
            log('SPLITFORMS_CONFIG: ' + (typeof SPLITFORMS_CONFIG));
            
            if (typeof submitForm === 'function') {
                log('✅ submitForm is ready');
            } else {
                log('❌ submitForm is NOT ready');
            }
            
            if (typeof submitToSplitForms === 'function') {
                log('✅ submitToSplitForms is ready');
            } else {
                log('❌ submitToSplitForms is NOT ready');
            }
        }
        
        async function testFullSubmit() {
            log('🧪 Testing full submission...');
            
            const testData = {
                'full-name-en': 'Test User',
                'full-name-bn': 'টেস্ট ইউজার',
                'email': 'test@example.com',
                'contact': '+880 1711-104318',
                'dob': '1990-01-01',
                'gender': 'Male',
                'training-program': 'Python Development'
            };
            
            try {
                const result = await submitToSplitForms(testData);
                log('📥 Result: ' + JSON.stringify(result, null, 2));
                
                if (result.success) {
                    showSuccess('✅ Full submission test PASSED!');
                } else {
                    showError('❌ Full submission test FAILED: ' + result.message);
                }
            } catch (error) {
                showError('❌ Exception: ' + error.message);
            }
        }
        
        function showSuccess(msg) {
            resultEl.innerHTML = `<div class="success">${msg}</div>`;
        }
        
        function showError(msg) {
            resultEl.innerHTML = `<div class="error">${msg}</div>`;
        }
        
        log('✅ Page loaded. Click buttons to test.');
        log('🔑 Access key: ' + (typeof SPLITFORMS_CONFIG !== 'undefined' ? SPLITFORMS_CONFIG.accessKey : 'NOT DEFINED'));
        log('📦 submitForm: ' + (typeof submitForm));
        log('📦 submitToSplitForms: ' + (typeof submitToSplitForms));
    </script>
</body>
</html>
