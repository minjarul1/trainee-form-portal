<!DOCTYPE html>
<html>
<head><title>Debug Test</title></head>
<body>
<h1>🧪 Form Debug Test</h1>
<button onclick="testFunctions()">Test Functions</button>
<button onclick="testSplitforms()">Test splitforms API</button>
<pre id="output"></pre>
<script src="splitforms.js"></script>
<script>
function log(msg) {
    document.getElementById('output').textContent += msg + '\n';
    console.log(msg);
}
function testFunctions() {
    log('=== Testing Functions ===');
    log('submitForm: ' + typeof submitForm);
    log('submitToSplitForms: ' + typeof submitToSplitForms);
    log('showTab: ' + typeof showTab);
    log('SPLITFORMS_CONFIG: ' + (typeof SPLITFORMS_CONFIG));
    if (SPLITFORMS_CONFIG) {
        log('Access Key: ' + SPLITFORMS_CONFIG.accessKey);
    }
}
async function testSplitforms() {
    log('\n=== Testing splitforms API ===');
    try {
        const result = await submitToSplitForms({
            'full-name-en': 'Debug Test',
            'email': 'test@test.com'
        });
        log('Result: ' + JSON.stringify(result, null, 2));
    } catch(e) {
        log('Error: ' + e.message);
    }
}
log('Page loaded. Click buttons to test.');
</script>
</body>
</html>
